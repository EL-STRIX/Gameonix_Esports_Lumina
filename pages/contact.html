<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact - LuminaBooks</title>
    
        <link href="../css/global.css" rel="stylesheet">
    <link href="../css/shared.css" rel="stylesheet">
    <link href="../css/contact.css" rel="stylesheet">
</head>
<body>
    
    <nav class="nav-bar">
        <div class="container nav-container">
            <a href="../index.html" class="nav-brand">LuminaBooks</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="books.html">Books</a>
                <a href="premium.html">Premium</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="faq.html">FAQ</a>
            </div>
            <div class="nav-actions">
                <button class="btn btn-outline" onclick="window.location.href='login.html'">Sign In</button>
                <button class="btn btn-primary">Get Started</button>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 100px;">
        <section class="contact-section">
            <h1 class="contact-title">Get in Touch</h1>
            <div class="contact-form-card">
                <form id="contactForm">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-grid">
            <div>
                <div class="footer-brand">LuminaBooks</div>
                <p class="footer-text">© 2024 LuminaBooks. All rights reserved.</p>
                <div class="footer-links">
                    <a href="privacy.html">Privacy Policy</a>
                    <a href="terms.html">Terms of Service</a>
                </div>
            </div>
            <div>
                <div class="footer-title">Contact Us</div>
                <div class="footer-links">
                    <a href="mailto:hello@luminabooks.com">hello@luminabooks.com</a>
                    <span>9876543210</span>
                    <span style="margin-top: 8px;">398, Ramkrishnapur Road, Barasat, near Jagadighata Market,<br>Kolkata, West Bengal 700125</span>
                </div>
            </div>
            <div>
                <div class="footer-title">Follow Us</div>
                <div style="display: flex; gap: 16px;">
                    <span>🌐</span>
                    <span>🔗</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
        <script src="../js/contact.js"></script>
</body>
</html>

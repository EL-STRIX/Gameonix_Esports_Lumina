<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact - LuminaBooks</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-background text-on-surface font-body-md d-flex flex-column min-vh-100 pt-navbar">
    
    <nav class="fixed-top w-100 bg-surface border-bottom border-surface-variant h-navbar">
        <div class="d-flex justify-content-between align-items-center h-100 px-gutter max-w-container-max mx-auto">
            <a href="../index.html" class="font-headline-md text-primary fw-bold text-decoration-none">LuminaBooks</a>
            <div class="d-none d-md-flex align-items-center gap-4">
                <a href="../index.html" class="font-label-md text-on-surface-variant hover-text-primary text-decoration-none">Home</a>
                <a href="books.html" class="font-label-md text-on-surface-variant hover-text-primary text-decoration-none">Books</a>
                <a href="premium.html" class="font-label-md text-on-surface-variant hover-text-primary text-decoration-none">Premium</a>
                <a href="about.html" class="font-label-md text-on-surface-variant hover-text-primary text-decoration-none">About</a>
                <a href="contact.html" class="font-label-md text-primary fw-bold text-decoration-none border-bottom border-primary border-2 pb-1">Contact</a>
                <a href="faq.html" class="font-label-md text-on-surface-variant hover-text-primary text-decoration-none">FAQ</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 max-w-container-max mx-auto w-100 px-margin-mobile px-md-4 py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="font-display-lg text-on-background mb-4 text-center">Get in Touch</h1>
                <div class="bg-surface-container-low p-5 rounded-xl border border-surface-variant book-card-shadow">
                    <form id="contactForm">
                        <div class="mb-4">
                            <label class="form-label font-label-md text-on-surface">Name</label>
                            <input type="text" class="form-control bg-surface-container-lowest" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label font-label-md text-on-surface">Email</label>
                            <input type="email" class="form-control bg-surface-container-lowest" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label font-label-md text-on-surface">Message</label>
                            <textarea class="form-control bg-surface-container-lowest" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn bg-primary text-on-primary w-100 rounded-pill font-label-md py-2">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="contactToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body font-label-md">
            Message Sent Successfully! We will be in touch.
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/contact.js"></script>
</body>
</html>
